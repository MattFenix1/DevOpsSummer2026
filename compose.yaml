services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - app-network
  backend:
    build:
      context: ./API
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    networks:
      - app-network
networks:
  app-network:
    driver: bridge